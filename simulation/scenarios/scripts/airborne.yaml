# Only the charter and the take-off, for tests that drive everything else themselves.
scenario: airborne
timeout_s: 300
expected_runtime_s: 120
fixture: ../demo_fixture.yaml
turns:
  - on: operator_message
    match: '^Använd ramen (?P<name>charter_\w+)\.$'
    say: ["Jag föreslår ramen {name}."]
    charter_proposal: {from_fixture: "{name}"}
  - on: operator_message
    match: '^Starta\.$'
    action: {skill: takeoff, params: {alt_m: 40}}
  - on: operator_message
    match: '.*'
    once: false
    say: ["Uppfattat."]
