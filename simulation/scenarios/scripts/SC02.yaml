# SC02: STOP mid-flight. The AI flies to P1; after the pilot's STOP it tries to resume
# (refused: only the pilot's click releases a stop), answers questions with text only,
# and resumes again once the pilot has pressed Resume. Test data for the scripted commander.
scenario: SC02
timeout_s: 900
expected_runtime_s: 360
fixture: ../demo_fixture.yaml
turns:
  - on: operator_message
    match: '^Använd ramen (?P<name>charter_\w+)\.$'
    say: ["Jag föreslår ramen {name}."]
    charter_proposal: {from_fixture: "{name}"}
  - on: operator_message
    match: '^Starta\.$'
    action: {skill: takeoff, params: {alt_m: 40}}
  - on: skill_event
    when: {skill: takeoff, status: done}
    action: {skill: goto, params: {at: "fixture:P1", alt_m: 40, speed_ms: 5}}
  - on: operator_override
    when: {action: stop}
    say: ["Jag har stannat. Jag försöker fortsätta."]
    action: {skill: resume, params: {}}
  - on: operator_message
    match: '^Vad hände\?$'
    say: ["Du tryckte på STOPP. Drönaren står still tills du trycker Fortsätt."]
  - on: operator_message
    match: '^Fortsätt\.$'
    say: ["Jag föreslår att vi fortsätter mot P1."]
    action: {skill: resume, params: {}}
  - on: operator_override
    when: {action: resume}
    say: ["Fortsätter mot P1."]
    action: {skill: resume, params: {}}
  - on: operator_message
    match: '.*'
    once: false
    say: ["Uppfattat."]
