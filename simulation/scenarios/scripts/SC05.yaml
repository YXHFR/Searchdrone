# SC05: height limits. The AI is asked to fly to HIGH at 150 m (over the charter and the
# hard limit); the gate refuses and the AI says why.
scenario: SC05
timeout_s: 600
expected_runtime_s: 200
fixture: ../demo_fixture.yaml
turns:
  - on: operator_message
    match: '^Använd ramen (?P<name>charter_\w+)\.$'
    say: ["Jag föreslår ramen {name}."]
    charter_proposal: {from_fixture: "{name}"}
  - on: operator_message
    match: '^Starta\.$'
    action: {skill: takeoff, params: {alt_m: 40}}
  - on: operator_message
    match: '^Flyg till HIGH\.$'
    action: {skill: goto, params: {at: "fixture:HIGH", alt_m: 150}}
  - on: gate_reject_retry
    once: false
    say: ["Grinden sa nej: höjden är över uppdragsramens gräns. Jag stannar på nuvarande höjd."]
  - on: operator_message
    match: '.*'
    once: false
    say: ["Uppfattat."]
