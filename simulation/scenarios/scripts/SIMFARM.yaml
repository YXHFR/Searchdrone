# SIMFARM (Gazebo, stills camera): the simulator farm's scripted search for people. The
# AI takes off, searches the box at P1 and, for each new person the perception reports,
# says what it saw and asks the pilot to confirm (it never confirms a find itself). When
# the box is searched it flies home and lands. The farm writes this script with the
# round's height in place of every "alt_m: 40". Test data for the scripted commander.
scenario: SIMFARM
timeout_s: 1800
expected_runtime_s: 600
fixture: ../demo_fixture.yaml
turns:
  - on: mission_created
    say: ["Hej. Säg vilken ram vi ska använda."]
  - on: operator_message
    match: '^Använd ramen (?P<name>charter_\w+)\.$'
    say: ["Jag föreslår ramen {name}."]
    charter_proposal: {from_fixture: "{name}"}
  - on: operator_message
    match: '^Starta\.$'
    action: {skill: takeoff, params: {alt_m: 40}}
  - on: skill_event
    when: {skill: takeoff, status: done}
    say: ["I luften. Flyger till P1."]
    action: {skill: goto, params: {at: "fixture:P1", alt_m: 40}}
  - on: skill_event
    when: {skill: goto, status: done}
    say: ["Söker av rutan efter den försvunna personen."]
    action: {skill: survey_sector, params: {polygon: "fixture:survey_box", alt_m: 40, spacing_m: 30, speed_ms: 7}}
  - on: detection
    when: {label: person}
    once: false
    say: ["Möjlig person hittad, bekräfta?"]
  - on: skill_event
    when: {skill: survey_sector, status: done}
    say: ["Rutan är sökt. Flyger hem och landar."]
    action: {skill: return_home, params: {reason: "Sökningen klar."}}
  - on: skill_event
    when: {skill: return_home, status: done}
    say: ["Uppdraget är klart. Drönaren har landat."]
  - on: operator_message
    match: '.*'
    once: false
    say: ["Uppfattat."]
