# SC08 g: the stop words in the chat, with the AI alive and dead, and lines that are not.
scenario: SC08
timeout_s: 900
expected_runtime_s: 300
fixture: ../demo_fixture.yaml
turns:
  - on: operator_message
    match: '^Använd ramen (?P<name>charter_\w+)\.$'
    say: ["Jag föreslår ramen {name}."]
    charter_proposal: {from_fixture: "{name}"}
  - on: operator_message
    match: '^Starta\.$'
    action: {skill: takeoff, params: {alt_m: 40}}
  - on: operator_message
    match: '^Flyg till P1\.$'
    action: {skill: goto, params: {at: "fixture:P1", alt_m: 40}}
  - on: operator_message
    match: '.*'
    once: false
    say: ["Uppfattat."]
