# SC08: the AI commander dies during the search (a, d, f).
scenario: SC08
timeout_s: 900
expected_runtime_s: 400
fixture: ../demo_fixture.yaml
turns:
  - on: operator_message
    match: '^Använd ramen (?P<name>charter_\w+)\.$'
    say: ["Jag föreslår ramen {name}."]
    charter_proposal: {from_fixture: "{name}"}
  - on: operator_message
    match: '^Starta\.$'
    action: {skill: takeoff, params: {alt_m: 40}}
  - on: operator_message
    match: '^Sök av rutan\.$'
    action: {skill: survey_sector, params: {polygon: "fixture:survey_box", alt_m: 40, spacing_m: 30, speed_ms: 7}}
  - on: idle_tick                  # back after a restart: only a question, never a move
    once: false
    say: ["Rutan är sökt. Vill du att jag gör något mer?"]
  - on: operator_message
    match: '^Flyg hem och landa\.$'
    action: {skill: return_home, params: {reason: "Operatören bad om det."}}
  - on: operator_message
    match: '.*'
    once: false
    say: ["Uppfattat."]
