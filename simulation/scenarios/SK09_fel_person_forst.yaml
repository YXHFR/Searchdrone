# SK09: a person in a red jacket without a backpack lies in sector A, the missing
# person (red top, blue backpack) in sector B. The drone searches A first: the operator
# rejects the wrong person, the map counts down there, and the right one is found in B.
# Synthetic world, no real person.
scenario: SK09
title: "Fel person avvisas, rätt hittas sedan"
home: { lat: -35.363261, lon: 149.165230, alt_amsl_m: 584.0, heading_deg: 353 }
pilot: { east_m: 0.0, north_m: 0.0 }
pins: []
areas:
  sector_a: { area_enu: [[150,150],[270,150],[270,270],[150,270]] }   # 120 x 120 m, centre 297 m NE
  sector_b: { area_enu: [[30,150],[150,150],[150,270],[30,270]] }
charters:
  charter_sk09:
    area_enu: [[-60,-60],[300,-60],[300,300],[-60,300]]               # farthest corner 424 m
    geofence_buffer_m: 20
    alt_min_agl_m: 20
    alt_max_agl_m: 120
    default_alt_agl_m: 40
    max_speed_ms: 12
    max_range_from_pilot_m: 500
    battery_rtl_pct: 15
    allowed_skills: [takeoff, goto, survey_sector, hold, resume, return_home, mark_location,
                     report, inspect_detection, orbit, capture_stills]
    sectors:
      - { sector_id: "A", name: "Sektor A", from: sector_a }
      - { sector_id: "B", name: "Sektor B", from: sector_b }
search:
  limit_s: 900
  survey: { alt_m: 50, spacing_m: 45, speed_ms: 7 }
  last_seen_enu: [0, 0]
  profile:
    subject_category: hiker
    garments:
      - { part: upper, colors: [red], certainty: certain }
      - { part: lower, colors: [black], certainty: likely }
    items:
      - { kind: backpack, colors: [blue], certainty: certain }
    likely_state: [lying, sitting]
  people:
    # Deep in sector A: the person's keep-out cylinder (30 m plus the position's spread)
    # stays out of sector B for every seed, so the search of B is never blocked.
    - { id: wrong-person, at_enu: [225, 210], jitter_m: 15, pose: lying, upper: red, lower: gray }
    - { id: target, target: true, at_enu: [90, 210], jitter_m: 30, pose: lying,
        upper: red, lower: black, backpack: blue }
  decoys:
    - { kind: rock, count: 6, area: sector_a, lure: 0.02 }
    - { kind: rock, count: 4, area: sector_b, lure: 0.02 }
