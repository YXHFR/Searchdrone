# A red test block next to the demo target P1, for the camera and the detector to find.
# `just sim objects=simulation/scenarios/objects/red_block.yaml` places it; the facit is
# written to build/sim/worlds/<world>_i<N>.truth.json. Shape: see sd_sim.objects.
- name: red_block
  kind: box
  east_m: 10.0
  north_m: 200.0
  size_m: [1.0, 1.0, 0.5]
  color: [0.80, 0.05, 0.05]
  label: 1
  truth: { is_target: true, kind: test_block }
