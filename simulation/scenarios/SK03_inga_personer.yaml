# SK03: no person at all, only SK02's decoys (the false-alarm test): the drone searches
# both sectors and lands, and nothing may be confirmed. Synthetic world.
scenario: SK03
title: "Ingen person, bara lockbeten"
home: { lat: -35.363261, lon: 149.165230, alt_amsl_m: 584.0, heading_deg: 353 }
pilot: { east_m: 0.0, north_m: 0.0 }
pins: []
areas:
  sector_a: { area_enu: [[150,150],[270,150],[270,270],[150,270]] }   # 120 x 120 m, centre 297 m NE
  sector_b: { area_enu: [[30,150],[150,150],[150,270],[30,270]] }
charters:
  charter_sk03:
    area_enu: [[-60,-60],[300,-60],[300,300],[-60,300]]               # farthest corner 424 m
    geofence_buffer_m: 20
    alt_min_agl_m: 20
    alt_max_agl_m: 120
    default_alt_agl_m: 40
    max_speed_ms: 12
    max_range_from_pilot_m: 500
    battery_rtl_pct: 15
    allowed_skills: [takeoff, goto, survey_sector, hold, resume, return_home, mark_location,
                     report, inspect_detection, orbit, capture_stills]
    sectors:
      - { sector_id: "A", name: "Sektor A", from: sector_a }
      - { sector_id: "B", name: "Sektor B", from: sector_b }
search:
  limit_s: 900
  survey: { alt_m: 50, spacing_m: 45, speed_ms: 7 }
  last_seen_enu: [0, 0]
  profile:
    subject_category: hiker
    garments:
      - { part: upper, colors: [red], certainty: certain }
      - { part: lower, colors: [black], certainty: likely }
    items:
      - { kind: backpack, colors: [blue], certainty: certain }
    likely_state: [lying, sitting]
  people: []
  decoys:
    - { kind: rock, count: 30, area: sector_a, lure: 0.02 }
    - { kind: rock, count: 20, area: sector_b, lure: 0.02 }
    - { kind: log, count: 7, area: sector_b, size_m: 1.6, lure: 0.04 }
    - { kind: backpack, color: gray, count: 1, area: sector_a, lure: 0.12 }
    - { kind: tarp, color: red, count: 1, area: sector_a, size_m: 2.0, lure: 0.15 }
