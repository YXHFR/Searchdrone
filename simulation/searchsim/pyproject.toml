[project]
name = "sd-searchsim"
version = "0.0.0"
description = "Fast 2D search simulator and a learned next-sector policy (advisory only)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.4",  # BSD-3-Clause
  "sd-motion",
]

[project.scripts]
sd-searchsim = "sd_searchsim.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
