# Radio link profiles for linksim. Jitter and loss apply to the UDP flows only
# (MAVLink and video); the TCP flow (SD-link) only gets the delay, in order.
perfect:
  delay_ms: 0
  jitter_ms: 0
  loss_pct: 0
field_typical:
  delay_ms: 40
  jitter_ms: 15
  loss_pct: 1
dead:
  delay_ms: 0
  jitter_ms: 0
  loss_pct: 100
