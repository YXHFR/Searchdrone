[project]
name = "sd-sim"
version = "0.0.0"
description = "Simulation tooling: SITL launcher, scenario runner and test helpers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sd-safety",  # the local east/north plane and the safety constants
  "sd-hwcalc",  # reads and validates hardware/drone.yaml
  "sd-detect",  # the class register: the labels of the scenario objects
  "pymavlink>=2.4.47",  # LGPL-3.0, used unmodified
  "pyyaml>=6.0",
  "jinja2>=3.1",  # BSD-3-Clause, renders the Gazebo model and world
  "numpy>=2.4",  # BSD-3-Clause, terrain heights and textures for site worlds
  "shapely>=2.1",  # BSD-3-Clause, map layers for site worlds
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
