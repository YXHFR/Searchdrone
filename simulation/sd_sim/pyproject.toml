[project]
name = "sd-sim"
version = "0.0.0"
description = "Simulation tooling: SITL launcher, scenario runner and test helpers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sd-safety",  # the local east/north plane and the safety constants
  "sd-hwcalc",  # reads and validates hardware/drone.yaml
  "pymavlink>=2.4.47",  # LGPL-3.0, used unmodified
  "pyyaml>=6.0",
  "jinja2>=3.1",  # BSD-3-Clause, renders the Gazebo model and world
  "asyncpg>=0.30",  # Apache-2.0, the instance database (also sd-ground's driver)
  "websockets>=15",  # BSD-3-Clause, the perf pilot's live connection
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
