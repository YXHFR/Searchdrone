# Searchdrone 7-inch quadcopter (fpv7): parameters of the baseline CAD model.
# Units: millimetres, grams, degrees. Every number has a row in README.md with its source,
# date and status. Axes: x forward, y left, z up; origin at the frame centre, z = 0 on the
# underside of the bottom plate.
schema_version: 1

frame:                        # GEPRC Mark4 7", 5 mm arms
  wheelbase: 295              # motor to motor, diagonal
  mass: 121                   # whole frame kit, spread over the pieces by volume
  bottom_plate: {length: 190, width: 50, thickness: 2.5, corner_radius: 8}
  top_plate: {length: 140, width: 40, thickness: 2.5, corner_radius: 10}
  arm: {thickness: 5, root_width: 28, tip_width: 30, root_offset: 30, tip_overhang: 15}
  standoff: {height: 25, diameter: 5, pattern_x: 120, pattern_y: 34}

motor: {diameter: 33.9, height: 20, mass: 47.6}     # EMAX ECO II 2807 1300KV, without leads
prop: {diameter_in: 7, swept_height: 10, gap_above_motor: 0, mass: 9.7}   # HQ 7x4x3 Durable PC

stack:                        # MicoAir743 V2 + 55 A AM32 4-in-1, 30.5 mm pattern
  grommet_height: 3
  board_gap: 4
  esc: {length: 44, width: 43.5, height: 5.2, mass: 14}
  fc: {length: 36, width: 36, height: 8, mass: 10}

bec: {length: 35, width: 24, height: 5.5, mass: 5}            # Matek BEC12S-PRO
receiver: {length: 23.7, width: 16.3, height: 4, mass: 1.4}     # RadioMaster RP4TD
remote_id: {length: 23.2, width: 18.2, height: 4, mass: 2.7}  # ESP32-S3 Super Mini

gps:                          # Holybro Micro M10
  length: 34
  width: 28
  height: 11
  mass: 16
  mast: {diameter: 10, height: 60, mass: 6}

battery: {length: 145, width: 64, height: 43, mass: 913}    # Dogcom 6S2P 21700 10 000 mAh

pi5:                          # Raspberry Pi 5: the board, ports and cooler as boxes
  length: 85
  width: 56
  height: 1.6
  underside_clearance: 3
  mass: 46
  ports: {length: 21, width: 53, height: 16, overhang: 3, mass: 0}
cooler: {length: 63.5, width: 42.5, height: 13.7, offset_from_gpio_end: 33, mass: 29}
ai_hat: {length: 65, width: 56.5, height: 15.6, standoff_height: 16, mass: 45}   # AI HAT+ 2 with heatsink
pi_tray: {length: 92, width: 58, height: 3, damper_height: 8, mass: 20}

camera:                       # Raspberry Pi Camera Module 3, standard lens
  length: 25
  width: 24
  height: 11.5
  mass: 4
  hfov_deg: 66
  vfov_deg: 41
camera_mount: {length: 30, width: 30, height: 6, mass: 4}

legs: {length: 20, width: 10, radius: 110, ground_clearance: 10, mass: 6}
misc: {mass: 80}              # wiring, XT60, screws, battery strap

layout:                       # design defaults: where the parts sit (x, or [x, y])
  stack_x: 0
  bec: [55, 0]
  receiver: [-62, 0]
  remote_id: [62, 0]
  pi_x: 4
  gps_x: -62
  battery_x: 0
  camera_x: 92

reference:
  takeoff_mass_g: 1500
  inertia_g_m2: [5.5, 6.5, 9.0]   # hand estimate before purchase (g m^2 = 0.001 kg m^2)

checks:
  prop_margin_min: 5
  cog_offset_max: 5
  fov_length: 500
  stl_tolerance: 0.05
