[project]
name = "sd-detect"
version = "0.0.0"
description = "The detector interface, the class register and the detector sources."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sd-schemas",
  "pydantic>=2.9",
  "numpy>=2.0",  # BSD-3-Clause, the colour detector's pixel arithmetic
  "onnxruntime>=1.30,<1.31",  # MIT, the trained person detector (OnnxDetector)
  "pillow>=11",  # MIT-CMU, resizing a picture to the detector's input
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
