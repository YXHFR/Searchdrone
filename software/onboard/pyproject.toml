[project]
name = "sd-onboard"
version = "0.0.0"
description = "The onboard process sd-onboard: runs skills as state machines and talks MAVLink to the flight controller."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sd-schemas", "sd-safety", "sd-mav", "sd-link", "sd-obs", "sd-geo", "sd-detect",
  "pydantic>=2.9",
  "shapely>=2.1",  # BSD-3-Clause
  "pillow>=11",  # MIT-CMU, the JPEG thumbnails of detections
]

[project.scripts]
sd-onboard = "sd_onboard.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
