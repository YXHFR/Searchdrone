[project]
name = "sd-brain"
version = "0.0.0"
description = "The AI mission commander sd-brain."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pillow>=11",  # MIT-CMU, the cloud image policy decodes and cleans crops
    "pyyaml>=6.0",
    "sd-schemas",
    "shapely>=2.1",
    "websockets>=15",  # proxy=None on connect
]

[project.scripts]
sd-brain = "sd_brain.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
