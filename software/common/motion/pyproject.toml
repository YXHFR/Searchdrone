[project]
name = "sd-motion"
version = "0.0.0"
description = "Where a lost person walks while we search: a terrain-steered motion model for the probability map."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]  # numpy: BSD-3-Clause

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
