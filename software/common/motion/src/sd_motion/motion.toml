# How each kind of missing person moves (sd_motion.params). Sources and guesses per row;
# the research is in the private planning repo (docs/research/rorelsemodell-forsvunna-2026-10-26.md).
#
# mobility: (hours since last seen, share still moving), piecewise linear in log time.
#   The first point is at 0 h; a share below 1 there means some never move.
# speed_kmh: walking speed on a track; terrain slows it (sd_motion.terrain).
# turn45 / turn_any: share of the walkers per minute who turn by 45 degrees / pick any
#   heading (direction travel versus random walk, Hashimoto et al. 2022).
# k_track: share per minute who turn onto a track they stand on or next to (route travel).
# trap: how much faster walkers stop in shrub and wetland (dementia: "walk until stuck").
# `just lpb-calibrate` scales turn45, turn_any and the mobility hours so the distances when
# everyone has stopped match Lie & Skaar (2016); `calibrated` records the last fit.

[dementia]
# Koester 2008, n = 42: 25 % never move, half stopped by 0.25 h, 25 % moving at 3.8 h,
# 5 % at 18 h. Speed and turning are guesses; k_track from 64 % found on a track (Lie & Skaar).
mobility = [[0, 0.75], [0.4204, 0.5], [6.391, 0.25], [30.27, 0.05]]
speed_kmh = 3.0
turn45 = 0.08
turn_any = 0.02
k_track = 0.8
trap = 4.0
calibrated = "2026-10-27: found within 0.04/0.75/3.17 km at 25/50/75 % (Lie & Skaar: 0.27/0.80/3.15); misses 25 % (0.04 km, target 0.27)"

