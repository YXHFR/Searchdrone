[project]
name = "sd-schemas"
version = "0.0.0"
description = "Shared message schemas (Pydantic models); the single source for every message between processes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13", "uuid-utils>=1.0,<2"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
