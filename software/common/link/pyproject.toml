[project]
name = "sd-link"
version = "0.0.0"
description = "SD-link: the control channel between the ground station and the onboard computer (envelopes over WebSocket)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sd-schemas", "sd-obs", "websockets>=15"]  # websockets: BSD-3-Clause

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"
