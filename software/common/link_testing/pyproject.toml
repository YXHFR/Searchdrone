[project]
name = "sd-link-testing"
version = "0.0.0"
description = "Test-only helpers for SD-link (lossy proxy, fake peers)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sd-link", "sd-obs", "sd-schemas", "websockets>=15"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
