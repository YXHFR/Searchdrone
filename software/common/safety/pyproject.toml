[project]
name = "sd-safety"
version = "0.0.0"
description = "Pure safety-gate logic."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sd-schemas",
  "pydantic>=2.13",
  "numpy>=2.0",  # BSD-3-Clause, the height floor's map grids
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
