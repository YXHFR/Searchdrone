# Alembic for the ground station database (owner role sd_owner).
# The connection URL is never stored here: migrations/env.py builds it from
# SD_GROUND__DB_* environment variables, or a caller passes it in config.attributes.
[alembic]
script_location = %(here)s/migrations
path_separator = os
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
