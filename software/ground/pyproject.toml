[project]
name = "sd-ground"
version = "0.0.0"
description = "The ground station sd-ground: API for the panel, database, safety gate, emergency path (STOP / RETURN HOME) and video."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "geoalchemy2>=0.17",
    "sqlalchemy[asyncio]>=2.0,<2.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
