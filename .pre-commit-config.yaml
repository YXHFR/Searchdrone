# Hooks: `just setup` installs them for pre-commit and pre-push.
# Never skip them (no --no-verify, no SKIP=). If a hook fails, fix the cause.
exclude: '(^|/)generated/|^software/ground/tests/contract/snapshots/|^LICENSES?(/|$)'
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # v0.16.9, same version as uv.lock (check_versions.py)
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # v1.50.3
    hooks:
      - id: typos

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, tsx, json]
      - id: forbidden-files
        name: forbidden files and private patterns
        entry: uv run tools/check_forbidden_files.py --staged --private-patterns config/local/private-patterns.txt
        language: system
        pass_filenames: false
        always_run: true
      - id: forbidden-files-push
        name: forbidden files and private patterns (pushed commits)
        entry: uv run tools/check_forbidden_files.py --range origin/main..HEAD --private-patterns config/local/private-patterns.txt
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: reuse
        name: reuse lint
        entry: uv run reuse lint
        language: system
        pass_filenames: false
        always_run: true
