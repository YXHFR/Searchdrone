# Spell checking. Swedish user-facing messages are allowed; add words here only
# when typos flags a correct Swedish or domain word.

[files]
extend-exclude = ["uv.lock", "pnpm-lock.yaml", "**/generated/**", "LICENSES/**", "LICENSE",
  "simulation/sitl/params/known_params_*.txt"]  # ArduPilot's own parameter names

[default.extend-words]
# Domain
sitl = "sitl"
brin = "brin"  # Postgres BRIN index (B0-04)
# Swedish
varning = "varning"
databas = "databas"
formen = "formen"
parm = "parm"
fpr = "fpr"
# Swedish (sd_schemas: skill names, reason texts, chat examples)
stopp = "stopp"
byt = "byt"
vill = "vill"
objekt = "objekt"
tak = "tak"
# Swedish (panel texts in software/panel/src/i18n/sv.json; "gir" and "som" are below)
meny = "meny"
tema = "tema"
vyer = "vyer"
manuell = "manuell"
# Simulator: ArduPilot parameter and frame names, package names, Swedish messages
gir = "gir"
som = "som"
paket = "paket"

[default.extend-identifiers]
# ArduPilot parameter and SITL frame names
MOT_THST_HOVER = "MOT_THST_HOVER"
hoverThrOut = "hoverThrOut"
