# Spell checking. Swedish user-facing messages are allowed; add words here only
# when typos flags a correct Swedish or domain word.

[files]
extend-exclude = ["uv.lock", "pnpm-lock.yaml", "**/generated/**", "LICENSES/**", "LICENSE",
  "simulation/sitl/params/known_params_*.txt",  # ArduPilot's own parameter names
  "software/brain/tests/eval/profiles/*",  # Swedish descriptions and the model's Swedish answers
  "tools/train/vendor/**"]  # model code as published by its authors

[default.extend-words]
# Domain
sitl = "sitl"
brin = "brin"  # Postgres BRIN index (B0-04)
ned = "ned"  # north-east-down, a Gazebo plugin tag (sd_quad14 model)
trak = "trak"  # MP4 box names (the recordings' video track and its runs, B1-16)
trun = "trun"
nd = "nd"  # OpenStreetMap XML: a way's node reference (<nd ref=...>)
ot = "ot"  # gdalwarp's -ot (output type), tools/terrain/fetch_site.py
# Swedish
varning = "varning"
databas = "databas"
formen = "formen"
parm = "parm"
fpr = "fpr"
# Swedish (sd_schemas: skill names, reason texts, chat examples)
stopp = "stopp"
byt = "byt"
vill = "vill"
objekt = "objekt"
tak = "tak"
exempel = "exempel"
linz = "linz"  # JKU Linz, the AOS dataset's university
# Swedish (sd_ground: CLI help and error texts, B1-05)
lokal = "lokal"
adress = "adress"
minut = "minut"
# Swedish (panel texts in software/panel/src/i18n/sv.json; "gir" and "som" are below)
meny = "meny"
tema = "tema"
vyer = "vyer"
manuell = "manuell"
# Simulator: ArduPilot parameter and frame names, package names, Swedish messages
gir = "gir"
som = "som"
paket = "paket"
# Swedish (sd_brain: chat texts, prompt examples and the command grammar, B1-10)
klick = "klick"
modell = "modell"
absolut = "absolut"
fram = "fram"  # also sd_onboard reasons for the operator (B1-07)
lage = "lage"
tre = "tre"
tio = "tio"
# Swedish (sd_ground: mission-flow texts, B1-12; "klick" above too)
ser = "ser"
ges = "ges"
nationella = "nationella"  # Nationella Marktäckedata, the land cover map (fetch_trees.py)
# Swedish (tools/bench: the image bank's messages, B2-11)
intervall = "intervall"
mapp = "mapp"
licens = "licens"
# Swedish (simulation/scenarios: the search scenarios' file names, B2-10)
falt = "falt"
forst = "forst"

[default.extend-identifiers]
# ArduPilot throttle failsafe (B1-07)
FS_THR_ENABLE = "FS_THR_ENABLE"
fs_thr_enable = "fs_thr_enable"
PILOT_THR_ = "PILOT_THR_"  # pilot-throttle parameter family (check_safety_manifest)
# ArduPilot parameter and SITL frame names
MOT_THST_HOVER = "MOT_THST_HOVER"
hoverThrOut = "hoverThrOut"
