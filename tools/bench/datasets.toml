# The image bank's datasets: real pictures from the air with person boxes, for training
# and measuring the person detector. Nothing here is committed or uploaded: `just
# bench-fetch yes=1` downloads each archive to <data_dir>/datasets/<name>/, checks its
# size and SHA-256 and stops on any difference.
#
#   name          short id, also the prefix of every image id ("heridal:test_TRS_0001")
#   licence       SPDX id of the data's licence, as read at the source on `checked`
#   use           what the data may be used for here: "train", "measure" (the locked
#                 test split) and "pretrain" (synthetic pictures, never measured on)
#   layout        how the archive is read (tools/bench/layouts.py)
#   url, size_bytes, sha256   the archive
#   labels_url, labels_size_bytes, labels_sha256   the labels' own archive, for a set
#                 published as pictures and labels apart (both are checked and unpacked)
#   more_archives  more picture archives ({url, size_bytes, sha256} each), for a set
#                 published as several; every one is checked and unpacked
#   share_folders, share_files   a set published as loose files on a WebDAV share, not
#                 as an archive: url is the share's folder, share_folders the folders
#                 fetched under it, share_files how many files they hold, size_bytes
#                 their total and sha256 the SHA-256 of their `sha256sum` lines sorted by
#                 path (tools/bench/README.md says how it is made)
#   ranges        the host serves byte ranges (single files can be read without the
#                 whole archive; the CI mini bank needs it)
#   publish_weights  whether weights trained on it may be published (false until the
#                 rights holder confirms it in writing)
#   publish_results  whether numbers measured on it may leave this computer (default true)
#   px_per_m      the ground scale of every picture in pixels per metre, for a set whose
#                 source states one for the whole set; without it the training reads the
#                 scale off the person boxes (tools/train/tiles.py, `scales=`)
#
# tools/tests/test_bench_datasets.py holds the licence rule: only open licences
# (CC0, CC BY, MIT, Apache) may be trained on; a non-commercial licence may only ever be
# "measure" with local_only = true. A GPL set, or one with no data licence (licence =
# "NONE"), may only be "measure" with local_only = true and publish_weights and
# publish_results false: measured on this computer, never trained on, nothing published
# (the owner's decision of 2026-11-01). Any other licence is not allowed at all.

[[dataset]]
name = "heridal"
title = "HERIDAL (wilderness search and rescue, Croatia)"
licence = "CC-BY-3.0"
checked = "2026-10-23"
attribution = "HERIDAL database, Božić-Štulić, Marušić and Gotovac, \"Deep Learning Approach in Aerial Imagery for Supporting Land Search and Rescue Missions\", IJCV 2019, University of Split (FESB); Zenodo record 5662351, CC BY 3.0"
source_page = "https://zenodo.org/records/5662351"
url = "https://zenodo.org/api/records/5662351/files/heridal_keras_retinanet_voc.zip/content"
size_bytes = 8311735812
sha256 = "63ea51b29d67f9b95cc600674c6ccfa719688594404b5311a9164fb41a0448a3"
layout = "heridal_voc"
# about 2 cm per pixel (Pyrrö et al. 2021, arXiv 2111.09406: "approximate 2 cm ground
# resolution", 4000x3000 pictures from 40-65 m). Its boxes
# hold many lying and sitting people (median longest side 71 px, about 1.4 m), so the
# boxes would put the scale three times too high
px_per_m = 50.0
use = ["train", "measure"]
licence_confirmed = true  # the Zenodo record licenses the dataset itself
ranges = true
publish_weights = true
local_only = false

