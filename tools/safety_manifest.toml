# The safety manifest: which parameter layers make up the flight controller's safety
# configuration per profile, and the files whose content is pinned. Checked by
# tools/check_safety_manifest.py (just test-contract): the layers must meet the safety
# rules in sd_sim.params, match what SITL and sd-onboard really load, and every pinned
# file must have the digest below. A change to a pinned file is a safety change: update
# the digest with `uv run tools/check_safety_manifest.py --update` in the same pull
# request and say why in its description.

# Layers in load order; a later layer wins.
[profile.sim]
layers = ["simulation/sitl/params/searchdrone-safety.parm"]

[profile.field]
layers = [
  "simulation/sitl/params/searchdrone-safety.parm",
  "simulation/sitl/params/searchdrone-safety.field.parm",
]

# .parm and .toml files are pinned by content (names and values), the rest by bytes.
