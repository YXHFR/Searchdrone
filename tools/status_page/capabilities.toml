# What the status page shows: one row per capability, in this order, grouped.
#
# variant  the test whose result.json the row reads (the test function's name, as the
#          pytest plugin writes it; SC00 writes its own report with variant "default")
# scenario only needed when the variant is not unique (SC00's "default")
# measure  the measured value to show: the criterion's text, as the test or the scenario
#          rig's until()/hold_for() names it. Without it the row shows the test's outcome.
#
# tools/tests/test_status_page.py checks that every test named here exists.

