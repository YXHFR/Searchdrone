# Ground station (sd-ground). Copied to config/ground.toml by `just setup-config`.
# Override any key with an environment variable SD_GROUND__<SECTION>__<KEY>
# (top-level keys: SD_GROUND__<KEY>). Unknown keys stop the server.
# Secrets are never stored here; they live in .env and secrets/ (both gitignored).

profile = "sim"                         # only the simulator profile exists in v0.1.0
data_dir = "~/.local/share/searchdrone" # mission data, outside the repository
default_vehicle_id = "sim-01"

[db]
# Postgres + PostGIS from compose.yaml (`just db-up`), loopback only.
# The server uses sd_app (password SD_GROUND__DB_APP_PASSWORD in .env);
# migrations run as sd_owner (password SD_GROUND__DB_PASSWORD in .env).
url = "postgresql+asyncpg://sd_app@127.0.0.1:5433/searchdrone"
owner_url = "postgresql+asyncpg://sd_owner@127.0.0.1:5433/searchdrone"

[http]
panel_bind = "127.0.0.1:8080"           # panel API; never reachable from the internet
commander_bind = "127.0.0.1:7700"       # API for the AI commander; always loopback
static_dir = "software/panel/dist"

[lan]
enabled = false                         # `just demo lan=1` turns on the LAN panel with TLS and PIN
bind = "0.0.0.0:8443"
tls_dir = "config/local/tls"

[sdlink]
bind = "127.0.0.1:7600"
link_tokens_file = "secrets/link_tokens.toml"

[mavlink]
listen = "udpin:127.0.0.1:14560"
gcs_sysid = 250
gcs_compid = 190
fc_endpoint = ""                        # empty = lock to the first valid HEARTBEAT

[gate]
operator_absent_s = 30
operator_absent_action = "hold"         # fixed: 30 s without a pilot -> alarm and hold

[auth]
cli_may_confirm = false                 # only the test rig sets true
brain_token_file = "secrets/brain_token"
search_token_file = "secrets/search_token"   # the search service's token (just search-token)

[charter]
max_area_km2 = 4.0

[video]
enabled = true                          # false: no video server (MediaMTX) on this machine
mediamtx_api = "http://127.0.0.1:9997"
mediamtx_whep = "http://127.0.0.1:8889"
mediamtx_hls = "http://127.0.0.1:8888"

[map]
pack = "demo"                           # <data_dir>/tiles/demo.pmtiles from `just maps-fetch`
zoom = 15                               # start zoom in the panel

[health]
internet_probe = false

[sim]
dataflash_dir = ""                      # set by the simulator (where SITL writes *.BIN)

[wind]
stage = "first_flights"                 # wind warning limit: first_flights 4 m/s; until_calibrated 8/12 m/s

[remote]
enabled = false                         # reserved; true is refused in v0.1.0
