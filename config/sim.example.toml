# Simulator. Copied to config/sim.toml by `just setup-config`.
# Override any key with an environment variable SD_SIM__<KEY>.
# Home position: the chosen world's public home (CMAC for the flat test world).

[sim]
instance = 0
physics = "gz"            # "gz" | "builtin"
gui = true                # Gazebo window, only with physics = "gz"
video = "camera"          # "camera" (gz only) | "test" | "off"
# world = "sd_hellasgarden"  # just sim: the public terrain world (default); just demo
#                             # and the test suites use the flat "sd_lake_forest" at CMAC
objects = ""              # objects with facit (gz only), a YAML file in the repo, e.g. simulation/scenarios/objects/red_block.yaml
vehicle = "sd_quad14"     # "sd_quad14" | "sd_fpv7" (alias fpv7: the 7-inch from hardware/cad/fpv7) | "stock" (ArduPilot's own quad / iris)
fixture = "simulation/scenarios/demo_fixture.yaml"
speedup = 1
wind_mps = 0
qgc = false
link_profile = "perfect"  # "perfect" | "field_typical" | "dead"
dataflash_dir = "sitl/logs"

[brain]
kind = "cloud"            # "cloud" | "scripted" | "grammar" | "none"
script = ""

[open]
browser = true

[perf]
gpu_name = ""
ram_gb = 0
