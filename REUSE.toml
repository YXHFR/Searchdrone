version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Searchdrone contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "hardware/**"
precedence = "override"
SPDX-FileCopyrightText = "Searchdrone contributors"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = "simulation/gazebo/sites/*/osm.geojson"
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors (https://www.openstreetmap.org/copyright)"
SPDX-License-Identifier = "ODbL-1.0"

# Committed from Copernicus; a site that sets [dem] source = "lantmateriet-mhm" commits a
# dem.asc from Lantmäteriet's Markhöjdmodell instead: "© Lantmäteriet", CC-BY-4.0 (add
# LICENSES/CC-BY-4.0.txt with it). Data the tools fetch into build/ and never commit (the
# real trees, the tree pictures) is listed with its attribution in ATTRIBUTION.
[[annotations]]
path = "simulation/gazebo/sites/*/dem.asc"
precedence = "override"
SPDX-FileCopyrightText = "produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved. The organisations in charge of the Copernicus programme by law or by delegation do not incur any liability for any use of the Copernicus WorldDEM-30."
SPDX-License-Identifier = "LicenseRef-Copernicus-WorldDEM-30"
