# git-cliff: the commit list of a release in CHANGELOG.md. `just release-prep` runs it
# with --unreleased --strip all and puts the result under the version's heading, after
# the hand-written notes from [Unreleased]. Version in simulation/versions.lock
# (git_cliff_version). Commit titles follow Conventional Commits (gate/pr-title).

[changelog]
header = ""
body = """
### Commits
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Releases only: an rc tag does not end the commit list of the release it leads to.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^hw", group = "<!-- 1 -->Hardware" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = "^revert", group = "<!-- 8 -->Reverted" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 9 -->Other" },
]
