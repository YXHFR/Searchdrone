[project]
name = "searchdrone-workspace"
version = "0.0.0"          # every pyproject.toml and package.json starts at 0.0.0; `just release-prep` sets the release version
requires-python = ">=3.12,<3.13"

[tool.uv]
required-version = ">=0.11,<0.12"
package = false
default-groups = ["dev", "test"]
# Versions released less than two weeks before they were locked (2026-10-16) are held back
# (B1-11); both ceilings may be lifted from 2026-10-25.
constraint-dependencies = ["shapely<2.2", "numpy<2.5.4"]

[tool.uv.workspace]
members = [
  "software/common/schemas", "software/common/safety", "software/common/geo",
  "software/common/mav", "software/common/link", "software/common/link_testing",
  "software/common/obs", "software/common/testing", "software/detector", "software/onboard", "software/ground",
  "software/brain", "software/hwcalc", "simulation/sd_sim",
]

[tool.uv.sources]
sd-schemas = { workspace = true }
sd-safety = { workspace = true }
sd-geo = { workspace = true }
sd-mav = { workspace = true }
sd-link = { workspace = true }
sd-link-testing = { workspace = true }
sd-obs = { workspace = true }
sd-testing = { workspace = true }
sd-detect = { workspace = true }
sd-onboard = { workspace = true }
sd-ground = { workspace = true }
sd-brain = { workspace = true }
sd-hwcalc = { workspace = true }
sd-sim = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.4", "pytest-asyncio>=1.0", "pytest-cov>=6.0", "pytest-xdist>=3.6",
  "pytest-rerunfailures>=15.0", "hypothesis>=6.130",
  "ruff>=0.16", "pyright>=1.1.400", "import-linter>=2.1", "reuse>=5.0",
  "httpx>=0.28", "pillow>=11", "packaging>=24", "pyyaml>=6.0", "jsonschema>=4.23",
  "pytest-socket>=0.7",  # B1-05: tests may only reach loopback
  # B1-11: build the small synthetic map fixture for the panel tests
  "pmtiles>=3.8.1", "mapbox-vector-tile>=2.2.0", "shapely>=2.1",
]
# Test-only workspace packages. Production packages never import these.
test = ["sd-link-testing", "sd-testing"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "TID", "N", "C4", "DTZ", "T20"]
# S = bandit rules (security), DTZ = timezone-aware datetimes, T20 = no print()

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"tools/**" = ["T20"]
"simulation/sd_sim/src/sd_sim/launch.py" = ["T20"]
"simulation/sd_sim/src/sd_sim/testrun.py" = ["T20"]
"simulation/sd_sim/src/sd_sim/_args.py" = ["T20"]
# Hand-written SQL migrations keep one column per line (B0-04)
"software/ground/migrations/versions/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sd_*"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["software/common/schemas/src", "software/common/safety/src"]
include = ["software", "simulation", "tools"]
exclude = ["**/node_modules", "**/.venv", "**/generated", "**/__pycache__"]
executionEnvironments = [{ root = "tools", extraPaths = ["tools"] }]

[tool.pytest.ini_options]
# Tests may only reach loopback and Unix sockets (pytest-socket): nothing calls the internet.
addopts = "--import-mode=importlib -ra --strict-markers --disable-socket --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket"
testpaths = ["software", "simulation/sd_sim", "tools/tests"]
pythonpath = ["tools"]     # tools/tests import the scripts in tools/ (not a package)
norecursedirs = ["node_modules", ".venv", "dist", "build", "generated"]
asyncio_mode = "auto"
markers = [
  "contract: schema, API and boundary contracts (may need Postgres)",
  "component: one process with faked neighbours",
  "db: needs Postgres+PostGIS (started by just db-up)",
  "sitl: needs ArduPilot SITL",
  "slow: > 10 s",
  # simulator tests (also registered by sd_sim.pytest_plugin)
  "gz: needs Gazebo (local only)",
  "llm: needs the local language model (local only, never in CI)",
  "nightly: runs only in the scheduled nightly suite",
  "script(name): script for the scripted commander",
  "budget_s(seconds): estimated wall time of a SITL test, stack start included",
  "private_db: the instance gets its own Postgres container",
  "param_override(file): extra SITL parameter layer for one test",
  "lan: needs lan=1 (local only)",
  "panel: drives the real panel in a browser (just test-panel-sitl only)",
]
