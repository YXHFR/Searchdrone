# Local services for the ground station. Started with `just db-up` (never by hand with
# the shell environment): docker compose reads secrets with --env-file .env.
# Every published port binds to 127.0.0.1 only. Image tags are pinned by digest and are
# at least two weeks old when pinned. Each ticket adds its own service block.
name: searchdrone

services:
  # --- db: Postgres 18 + PostGIS 3.6 (B0-04) ---
  db:
    # postgis/postgis:18-3.6, pushed 2026-08-31 (multi-arch index digest)
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    restart: unless-stopped
    environment:
      POSTGRES_DB: searchdrone
      POSTGRES_USER: sd_owner
      POSTGRES_PASSWORD: ${SD_GROUND__DB_PASSWORD:?saknas i .env, kör just setup-config}
    ports: ["127.0.0.1:5433:5432"]
    # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker, so the
    # volume is mounted one level up (not on /var/lib/postgresql/data).
    volumes: [sd-pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sd_owner -d searchdrone"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  # --- mediamtx: live video (WebRTC/WHEP, HLS fallback) and recordings (B1-09) ---
  mediamtx:
    # bluenviron/mediamtx:1.21.1, published 2026-09-20 (multi-arch index digest)
    image: bluenviron/mediamtx:1.21.1@sha256:5ce2a948eb68df06ce2e13870db8df8e30d516ac4dc40e04bfe8aee3bdf7be40
    restart: unless-stopped
    # Every listener still binds 127.0.0.1 (config/mediamtx.yml); only UDP 8189 moves
    # to the LAN address in LAN mode.
    # host-network: WebRTC media over UDP is simplest this way in WSL2
    network_mode: host
    # The recordings belong to the owner's user, so the ground station can hard-link them.
    user: "${SD_UID:?saknas i .env, kör just setup-config}:${SD_GID:?saknas i .env, kör just setup-config}"
    environment:
      TZ: UTC
      # Signalling always on loopback only (the panel goes through the ground's proxy).
      MTX_WEBRTCADDRESS: "127.0.0.1:8889"
      MTX_WEBRTCLOCALUDPADDRESS: "${SD_VIDEO_BIND:-127.0.0.1}:8189"
      MTX_WEBRTCADDITIONALHOSTS: "${SD_LAN_IP:-}"
      MTX_HLSADDRESS: "127.0.0.1:8888"
      MTX_RTSPADDRESS: "127.0.0.1:8554"
      MTX_APIADDRESS: "127.0.0.1:9997"
      MTX_AUTHINTERNALUSERS_0_PASS: "${SD_GROUND__VIDEO_PUBLISH_PASSWORD:?saknas i .env, kör just setup-config}"
      MTX_AUTHINTERNALUSERS_2_PASS: "${SD_GROUND__VIDEO_API_PASSWORD:?saknas i .env, kör just setup-config}"
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ${SD_DATA_DIR:?saknas i .env, kör just setup-config}/video:/recordings

volumes:
  sd-pgdata:
