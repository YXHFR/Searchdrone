# Local services for the ground station. Started with `just db-up` (never by hand with
# the shell environment): docker compose reads secrets with --env-file .env.
# Every published port binds to 127.0.0.1 only. Image tags are pinned by digest and are
# at least two weeks old when pinned. Each ticket adds its own service block.
name: searchdrone

services:
  # --- db: Postgres 18 + PostGIS 3.6 (B0-04) ---
  db:
    # postgis/postgis:18-3.6, pushed 2026-08-31 (multi-arch index digest)
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    restart: unless-stopped
    environment:
      POSTGRES_DB: searchdrone
      POSTGRES_USER: sd_owner
      POSTGRES_PASSWORD: ${SD_GROUND__DB_PASSWORD:?saknas i .env, kör just setup-config}
    ports: ["127.0.0.1:5433:5432"]
    # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker, so the
    # volume is mounted one level up (not on /var/lib/postgresql/data).
    volumes: [sd-pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sd_owner -d searchdrone"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  # --- mediamtx: live video and recording per mission (B1-09) ---
  # Start with `just video-up`. Signalling (WHEP 8889), HLS (8888), RTSP (8554) and the
  # API (9997) are always on 127.0.0.1; the panel reaches them only through sd-ground.
  # Only the WebRTC media port UDP 8189 moves to the LAN address in LAN mode
  # (SD_VIDEO_BIND). Publishing needs the password from .env.
  mediamtx:
    # bluenviron/mediamtx:1.21.1, pushed 2026-09-20 (multi-arch index digest)
    image: bluenviron/mediamtx:1.21.1@sha256:5ce2a948eb68df06ce2e13870db8df8e30d516ac4dc40e04bfe8aee3bdf7be40
    restart: unless-stopped
    # host-network: WebRTC over UDP works most simply this way in WSL2; every TCP address is pinned to 127.0.0.1 below
    network_mode: host
    user: "${SD_UID:?saknas i .env, kör just setup-config}:${SD_GID:?saknas i .env, kör just setup-config}"
    environment:
      TZ: UTC
      MTX_WEBRTCADDRESS: "127.0.0.1:8889"
      MTX_WEBRTCLOCALUDPADDRESS: "${SD_VIDEO_BIND:-127.0.0.1}:8189"
      MTX_WEBRTCADDITIONALHOSTS: "${SD_LAN_IP:-}"
      MTX_HLSADDRESS: "127.0.0.1:8888"
      MTX_AUTHINTERNALUSERS_0_PASS: ${SD_GROUND__VIDEO_PUBLISH_PASSWORD:?saknas i .env, kör just setup-config}
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - ${SD_DATA_DIR:?saknas i .env, kör just setup-config}/video:/recordings


  # --- llm: the local AI model in llama-server (B1-10), profile "ai" ---
  # Start with `just llm-up`. The key comes from .env (SD_LLM_API_KEY); without it the
  # service refuses to start. The port is published on loopback only and never tunnelled.
  llm:
    profiles: ["ai"]
    # llama.cpp server-cuda12-b11347, built 2026-10-02 (digest from runtime.lock.toml)
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11347@sha256:d87b02aafa74797a2d599b281c50468704bd0bcdc57bfcf31b570d593f1d285b
    restart: unless-stopped
    ports: ["127.0.0.1:8091:8091"]
    volumes: ["./models:/models:ro"]
    environment:
      LLAMA_API_KEY: ${SD_LLM_API_KEY:?SD_LLM_API_KEY saknas i .env, kör just setup-config}
    command: ["-m", "/models/Qwen3VL-4B-Instruct-Q4_K_M.gguf",
              "--host", "0.0.0.0", "--port", "8091",
              "--jinja", "-c", "8192", "-ngl", "99", "--parallel", "1",
              "-fa", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0",
              "--cache-reuse", "256", "--metrics"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/health || wget -qO- http://localhost:8091/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 60s

volumes:
  sd-pgdata:
