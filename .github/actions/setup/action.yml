name: Setup
description: >-
  Shared tool setup for CI jobs: uv, Node and pnpm, just, all dependencies and local
  example config. Runs after actions/checkout (a local action cannot check itself out).
  Versions come from simulation/versions.lock, .nvmrc and package.json.

runs:
  using: composite
  steps:
    - name: Read pinned versions
      id: versions
      shell: bash
      # Fixed values only: the tool directory and a constant; no untrusted input.
      run: | # zizmor: ignore[github-env]
        echo "uv=$(python3 tools/versions.py uv_version)" >> "$GITHUB_OUTPUT"
        echo "just=$(python3 tools/versions.py just_version)" >> "$GITHUB_OUTPUT"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "$GITHUB_ENV"

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ steps.versions.outputs.uv }}
        enable-cache: true

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Install pnpm (Corepack) and just
      shell: bash
      env:
        JUST_VERSION: ${{ steps.versions.outputs.just }}
      run: |
        mkdir -p "$HOME/.local/bin"
        corepack enable --install-directory "$HOME/.local/bin"
        uv tool install "rust-just==${JUST_VERSION}"

    - name: Install dependencies and example config
      shell: bash
      run: |
        uv sync --all-packages --frozen
        pnpm install --frozen-lockfile
        just setup-config
