name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please keep personal data out of the issue (addresses, real coordinates, network details).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: safety
    attributes:
      label: Flight-safety considerations
      description: Would this change what the drone can do? How could it be tested in the simulator?
