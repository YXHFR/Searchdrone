# The automatic part of the hardware gate. Runs on every pull request and push to main
# (no path filter at workflow level, so the required check `hardware-ok` always reports).
# `changes` decides whether the hardware jobs need to run; `hw-files` fails closed on any
# file under hardware/ that has no automatic check yet (tools/check_hw_files.py), and
# `hw-calc` checks mass and flight time against hardware/limits.yaml (`just hw-check`), and
# `hw-cad` builds the CAD models and runs their checks (`just cad-detailed`, `just cad-test`),
# and fails when the simulator's sd_fpv7 no longer matches the CAD model
# (`just sim-model-fpv7 --check`).
# The owner's approval for hardware/ is a separate check (`gate/owner`, owner-gate.yml).
name: hardware

on:
  pull_request:
    # edited: a new base branch changes the diff, so the hardware jobs run again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does this change touch the hardware gate?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        # Push to main and the merge queue always run the hardware jobs.
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_hw_files.py --changes --base "$PR_BASE" --head "$PR_HEAD" \
              --github-output "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  hw-files:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every changed hardware file has an automatic check
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        # A push without a previous commit (BEFORE is zeros) checks every hardware file.
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MG_BASE"; head="$MG_HEAD" ;;
            *) base="${BEFORE:-0000000000000000000000000000000000000000}"; head="$SHA" ;;
          esac
          python3 tools/check_hw_files.py --base "$base" --head "$head"

  hw-calc:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Mass and flight time within the hardware limits
        run: just hw-check

  hw-cad:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # The CAD build plus its tests take about 20 min on the runner; 35 leaves headroom.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      # The manufacturer models are downloaded on every run and never cached: some of
      # them may not be redistributed (vendor.yaml), and a cache saved on main can be
      # restored by any pull request's workflow. vendor.py checks each SHA-256.
      - name: Build the CAD models (STEP, STL, report, picture, detailed STEP)
        run: just cad-detailed
      - name: Overlaps, propeller margins, camera view and repeatable exports
        run: just cad-test
      - name: The simulator's sd_fpv7 matches the CAD model (mass, inertia, meshes)
        run: just sim-model-fpv7 --check
      - name: No orthophotos in the uploaded CAD files
        run: python3 tools/check_no_orthophotos.py build/cad/fpv7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cad-fpv7
          # Only build/cad/fpv7/. The manufacturer models (build/cad/vendor/) and the
          # detailed STEP (build/cad/fpv7-detailed/) are built and checked but never
          # published: vendor.yaml says which licences allow sharing.
          path: build/cad/fpv7/
          if-no-files-found: error
          retention-days: 14

  hardware-ok:
    if: always()
    needs: [changes, hw-files, hw-calc, hw-cad]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci_aggregate.jq
          sparse-checkout-cone-mode: false
      - name: Hardware jobs succeeded, or were skipped because nothing needed them
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e -f tools/ci_aggregate.jq
