# Flight tests in ArduPilot SITL with its builtin physics, headless, in the SITL image.
# Runs on every pull request (no path filter on the workflow, so the required check
# `sitl-ok` always reports); the `changes` job decides whether the tests are needed.
# The scheduled and on-demand runs add the nightly suites.
name: sitl

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "pr = the pull request suite, nightly = the nightly suites"
        type: choice
        options: [pr, nightly]
        default: pr
      ref:
        description: "Commit SHA to test; must be the head of the branch the run starts on"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sitl-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every flight runs in real time (SITL speedup 1).
  SD_SIM__SPEEDUP: "1"
  # A missing simulator binary fails the tests instead of skipping them.
  SD_SIM__REQUIRE_SITL: "1"
  SHARDS: "4"
  WORKERS: "4"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did anything the flight tests depend on change?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        # Push to main, schedule and workflow_dispatch always run the tests.
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MG_BASE"; head="$MG_HEAD" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "bas- eller head-commit saknas i händelsen"; exit 1
          fi
          # A failing diff must fail the job, never turn into "nothing changed".
          git diff --name-only "$base...$head" > "$RUNNER_TEMP/changed.txt"
          # Deny-list: only files that cannot change a flight test skip it; anything
          # else (including files added later) runs the tests.
          run=false
          while IFS= read -r file; do
            case "$file" in
              *.md|LICENSE|LICENSES/*|REUSE.toml|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml|\
              hardware/cad/*|hardware/pcb/*|hardware/bom/*|typos.toml|.editorconfig) ;;
              *) echo "kan påverka SITL-testerna: $file"; run=true ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  sitl:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # The tests themselves have 35 minutes (step below); the rest is for building the
    # image when it is not in the registry yet (a pull request that changes it).
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &check-ref
        name: The requested commit is the one checked out
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$REF" ] && [ "$REF" != "$SHA" ]; then
            echo "ref=$REF är inte grenens senaste commit ($SHA). Starta körningen när den är det."
            exit 1
          fi
      - &setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - &db
        name: Start Postgres from compose.yaml
        run: docker compose --env-file .env up -d --wait db
      - &image
        name: SITL image (pull, or build when the tag is not published)
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="$(bash tools/sitl_image_tag.sh --image)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          pulled=false
          if echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin; then
            docker pull "$image" && pulled=true
            docker logout ghcr.io
          fi
          if [ "$pulled" != true ]; then
            echo "::notice::$image finns inte i registret; bygger den här (utan push)."
            docker build -f simulation/docker/sitl.Dockerfile -t "$image" .
          fi
      - &versions
        name: ArduCopter in the image matches simulation/versions.lock
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          tag="$(python3 tools/versions.py ardupilot_tag)"
          want="ArduCopter V${tag#Copter-}"
          got="$(docker run --rm "$IMAGE" bash -c \
            'grep -a -o -m1 "ArduCopter V[0-9][0-9.]*" "$SD_ARDUCOPTER_BIN" | head -n1')"
          marker="$(docker run --rm "$IMAGE" cat /opt/ardupilot/.sd_version)"
          echo "låst: $tag, binären: $got, märket: $marker"
          [ "$got" = "$want" ] && [ "$marker" = "$tag" ]
      - name: SITL tests (builtin physics, scripted commander)
        timeout-minutes: 35
        env:
          SD_SITL_IMAGE: ${{ steps.image.outputs.image }}
          SHARD: ${{ matrix.shard }}
        run: |
          just ci-sitl physics=builtin brain=scripted "shard=$SHARD" "shards=$SHARDS" \
            "workers=$WORKERS"
      - &summary
        name: Summary
        if: always()
        run: |
          if [ -f runs/summary.md ]; then cat runs/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - &scan
        name: No secrets in the test results
        id: scan
        if: always()
        run: |
          mkdir -p runs
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir runs/ --config .gitleaks.toml --redact --exit-code 1
      - &results
        name: Upload results
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitl-results-${{ github.job }}-${{ strategy.job-index }}
          path: |
            runs/**/result.json
            runs/summary.md
            !runs/**/secrets/**
            !build/sim/**/secrets/**
          if-no-files-found: warn
          retention-days: 14
      - &logs
        name: Upload logs (only when a test failed)
        if: failure() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitl-logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            runs/**/*.tlog
            runs/**/*.BIN
            runs/**/*.log
            !runs/**/secrets/**
            !build/sim/**/secrets/**
          if-no-files-found: ignore
          retention-days: 14

  video:
    # Live video and recordings (B1-09): the synthetic camera with the time code strip
    # (the builtin-physics picture) through the simulated radio and video_relay into
    # MediaMTX from compose.yaml, then the ground station's WHEP proxy in Google Chrome
    # (Playwright's Chromium does not decode H.264). No SITL needed, so it runs on the
    # runner itself, next to the SITL job.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - *checkout
      - *setup
      - name: GStreamer and ffmpeg for the video processes and checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-rtsp python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            ffmpeg iproute2
      - *db
      - name: Database schema and MediaMTX
        run: |
          just migrate
          just video-up
      - name: Google Chrome is installed
        run: google-chrome --version
      - name: Video tests (MediaMTX required, never skipped)
        timeout-minutes: 15
        env:
          SD_SIM__REQUIRE_VIDEO: "1"
        run: just test-video
      - *scan
      - *results
      - name: Upload video logs (only when a test failed)
        if: failure() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-logs
          path: |
            runs/**/*.log
            runs/**/*.json
            !runs/**/secrets/**
            !build/sim/**/secrets/**
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # The demo (SC01) end to end as processes, as `just demo` starts them, plus the demo's
    # manual step and the emergency buttons (`just e2e runs=1`). Beside the shards, so the
    # shards' budget is unchanged; the e2e tests are not in the shards' selection.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - *checkout
      - *check-ref
      - *setup
      - *image
      - *versions
      - name: End-to-end run (database and MediaMTX from compose.yaml, SITL image)
        timeout-minutes: 30
        env:
          SD_SITL_IMAGE: ${{ steps.image.outputs.image }}
        run: just e2e runs=1
      - *summary
      - *scan
      - *results
      - *logs

  e2e-offline:
    # The same run with the stack cut off from the internet (F-07): the test user's
    # traffic beyond loopback and the database network's traffic beyond its subnet are
    # refused (tools/offline/isolate.sh); the runner's own traffic is not.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - *checkout
      - *check-ref
      - *setup
      - *image
      - *versions
      - name: Offline end-to-end run
        timeout-minutes: 30
        env:
          SD_SITL_IMAGE: ${{ steps.image.outputs.image }}
        run: just e2e offline=1 runs=1
      - name: The runner itself still reaches GitHub
        if: always()
        run: curl -fsS -m 10 -o /dev/null https://api.github.com
      - *summary
      - *scan
      - *results
      - *logs

  sitl-ok:
    if: always()
    needs: [changes, sitl, video, e2e, e2e-offline]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci_aggregate.jq
          sparse-checkout-cone-mode: false
      - name: All SITL shards succeeded, or none were needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e -f tools/ci_aggregate.jq

  sitl-nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - *checkout
      - *check-ref
      - *setup
      - *db
      - *image
      - *versions
      - name: Nightly SITL suite
        timeout-minutes: 45
        env:
          SD_SITL_IMAGE: ${{ steps.image.outputs.image }}
        run: just ci-sitl mode=nightly physics=builtin brain=scripted "workers=$WORKERS"
      - *summary
      - *scan
      - *results
      - *logs

  e2e-nightly:
    # Ten rounds of the end-to-end set on the same commit (F-01: 10 of 10 for a release).
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    permissions:
      contents: read
      packages: read
    steps:
      - *checkout
      - *check-ref
      - *setup
      - *image
      - *versions
      - name: End-to-end run, 10 rounds
        timeout-minutes: 180
        env:
          SD_SITL_IMAGE: ${{ steps.image.outputs.image }}
        run: just e2e runs=10
      - *summary
      - *scan
      - *results
      - *logs

  sitl-nightly-gz:
    # Gazebo as a server with headless rendering (no window, no GPU). Not required.
    # The smoke flight flies ArduPilot's stock quad; the parity flight flies sd_quad14;
    # the sd_fpv7 smoke flights fly the 7-inch built from the CAD model. Then SK-RED: the
    # stills camera in Gazebo, the colour detector and the whole chain to the ground and
    # the AI must find every red block.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
    runs-on: ubuntu-24.04
    timeout-minutes: 320  # 60 install + 15 smoke + 15 before + 15 pictures + 30 trees + 20 twice-build + 15 + 15 + 3 x 15 fpv7 + 20 parity + 45 SK-RED + margin
    steps:
      - *checkout
      - *check-ref
      - *setup
      - *db
      - name: Install ArduPilot SITL and Gazebo Harmonic (same script as on the owner's computer)
        timeout-minutes: 60
        run: bash tools/setup/wsl-setup.sh sim
      - name: Smoke flight with Gazebo as a server (gz sim -s -r --headless-rendering)
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just sim-smoke physics=gz gui=false
      - name: Pictures of the terrain world before its real trees (generated forest)
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just world-snapshot
          for d in runs/*-snapshot-i0; do mv "$d" "runs/before-real-trees-$(basename "$d")"; done
      # Only the CC0 tree pictures (Poly Haven) are cached. The tree list and the raster
      # crop in build/trees come from Skogsstyrelsen's tree height raster, whose download
      # terms forbid redistribution, so they are fetched again on every run and never
      # cached: a cache saved on main can be restored by any pull request's workflow,
      # also from a fork. No step may upload or cache build/trees.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tree-pictures
        with:
          path: build/tree_models
          key: tree-pictures-cc0-${{ hashFiles('tools/terrain/fetch_tree_models.py') }}
      - name: The tree pictures (Poly Haven, CC0)
        if: steps.tree-pictures.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: just tree-pictures-fetch
      - name: The real trees (tree height raster and land cover, fetched every run)
        timeout-minutes: 30
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gdal-bin
          just trees-fetch site=hellasgarden
      - name: The terrain world built twice from scratch gives the same files
        timeout-minutes: 20
        run: uv run --package sd-sim python -m sd_sim.terrain site=hellasgarden twice=1
      - name: Smoke flight in the terrain world (real-time factor in result.json)
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just sim-smoke physics=gz gui=false world=sd_hellasgarden
      - name: Pictures and measurements of the terrain world
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just world-snapshot
      - name: sd_fpv7 smoke flight in the standard world (sd_lake_forest at CMAC)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just sim-smoke physics=gz gui=false vehicle=fpv7
      - name: sd_fpv7 smoke flight in the terrain world
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just sim-smoke physics=gz gui=false world=sd_hellasgarden vehicle=fpv7
      - name: sd_fpv7 smoke flight with builtin physics (hover current in result.json)
        # Gazebo's JSON link carries no battery data; the builtin model's current does.
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just sim-smoke physics=builtin gui=false vehicle=fpv7
      - name: Terrain world in the job summary
        if: always()
        run: |
          for f in runs/*-smoke-i0/result.json; do
            [ -f "$f" ] || continue
            jq -r '"- smoke \(.vehicle // "-") \(.physics) \(.world // "-"): passed \(.passed), real-time factor \(.real_time_factor // "-"), camera \(.camera_frames_10s // "-") frames in 10 s, hover current \(.hover_current_a // "-") A"' "$f" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          for f in runs/*-snapshot-i0/snapshots/summary.md; do
            [ -f "$f" ] || continue
            case "$f" in
              runs/before-real-trees-*) echo "### Before: generated forest" ;;
              *) echo "### After: real trees" ;;
            esac >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Our own vehicle in Gazebo (sd_quad14 takes off, hovers and lands like in SITL)
        # Runs even when the smoke flight's checks fail: the two flights test different
        # vehicles, and a red smoke flight must not hide this one.
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SD_SIM__HEADLESS: "1"
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just test-sitl sc=test_model_parity_gz physics=gz
      - name: SK-RED, search for red blocks with the camera (Gazebo)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        env:
          SD_SIM__HEADLESS: "1"
        run: |
          # shellcheck disable=SC1090
          source "$HOME/.searchdrone_env"
          just test-sitl sc=SK-RED physics=gz
      - *summary
      - *scan
      - *results
      - name: Upload the terrain world's pictures
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-snapshots
          path: |
            runs/**/snapshots/**
            runs/*-smoke-i0/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the search record (map, stills with the detector's boxes, numbers)
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sk-red-search
          path: |
            runs/**/search/**
            runs/**/truth.json
            !runs/**/secrets/**
          if-no-files-found: warn
          retention-days: 14
      - *logs

  sitl-e2e:
    # The panel in a browser against the simulator and the scripted commander, logged in
    # like a person (`just test-panel-sitl`). Not required in v0.1.0.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - *checkout
      - *check-ref
      - *setup
      - *db
      - *image
      - *versions
      - name: Browsers for Playwright
        run: pnpm --filter @searchdrone/panel exec playwright install --with-deps chromium
      - name: Panel against SITL
        timeout-minutes: 30
        env:
          SD_SITL_IMAGE: ${{ steps.image.outputs.image }}
        run: just test-panel-sitl
      - *summary
      - *scan
      - *logs
