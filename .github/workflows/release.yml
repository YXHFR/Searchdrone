# Publishes a GitHub release when the owner pushes a tag vX.Y.Z (after `just release-prep`
# and its pull request are merged). The build job checks the tag against every version,
# checks that every commit since the previous tag came from a pull request with green
# gates, builds the Python packages and the panel and writes the release notes from
# CHANGELOG.md. Only the publish job can write, and it runs no repository code: it
# uploads what the build job made. Nothing here creates or moves a tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # check_merged_pr_gates: the PR behind each commit
      statuses: read # and the gate statuses on its head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: The tagged commit is on main
        run: |
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag matches every version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/check_versions.py --expect "${TAG#v}"
      - name: Every commit since the previous tag came from a pull request with green gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_merged_pr_gates.py --sha "$GITHUB_SHA"
      - name: Build
        run: just build
      - name: Release notes and assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/release
          uv run --no-sync python tools/release_prep.py "$TAG" --notes > dist/release/notes.md
          cp dist/*.whl dist/*.tar.gz dist/release/
          tar -C software/panel -czf "dist/release/searchdrone-panel-${TAG}.tar.gz" dist
          (cd dist/release && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
      - name: No orthophotos in the release
        run: python3 tools/check_no_orthophotos.py dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file release/notes.md ${prerelease[@]+"${prerelease[@]}"} \
            release/*.whl release/*.tar.gz release/SHA256SUMS
