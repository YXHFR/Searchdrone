# Publishes a GitHub release when the owner pushes a tag vX.Y.Z (after `just release-prep`
# and its pull request are merged). The gates job first refuses a tag that is not on
# main and checks that every commit on main came from a pull request whose gates, worked
# out again from its comments, label events, title and files, were green
# (check_merged_pr_gates.py). Only then does the build job check the tag against every
# version, build the Python packages and the panel and write the release notes from
# CHANGELOG.md. Only the publish job can write, and it runs no repository code: it
# uploads what the build job made. Nothing here creates or moves a tag.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # First and alone: nothing from the repository runs here except the four gate scripts,
  # which check_owner_gate.PROTECTED keeps behind owner-ok. The anchor, the release to
  # start after, comes from GitHub and git alone: the newest published vX.Y.Z[-rc.N]
  # release whose tag is on the tagged commit's line, made by github-actions[bot] (none
  # for the first release, and then no such release may exist anywhere else). The
  # check runs with the anchor's scripts, which first confirm that release.yml made the
  # anchor and that its run succeeded (check_merged_pr_gates.release_anchor), and starts
  # after it, so a later merge that loosened them is judged by the rules before it. Any
  # error stops the release. They run from a clean directory (no other tools/*.py can
  # shadow an import) with PyYAML pinned by hash for Python 3.12. A release.yml without
  # this job, or a deleted release, is the owner's to stop: a ruleset on v* tags and
  # immutable releases (see the checker).
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # and the published releases
      actions: read # the release.yml run behind the anchor release
      pull-requests: read # check_merged_pr_gates: the PR behind each commit
      issues: read # and its review comments and owner-ok label events
      checks: read # and when its head commit reached GitHub (the first check suite)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Every commit on main came from a pull request with green gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PyYAML hash below is the cp312 wheel's.
          /usr/bin/python3 -I -c 'import sys; sys.exit(sys.version_info[:2] != (3, 12))' || {
            echo "release.yml väntar sig Python 3.12 för PyYAML-hashen" >&2
            exit 1
          }
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          cd "$GITHUB_WORKSPACE"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | [.tag_name, .author.login] | @tsv' \
            > "$gate/releases.txt"
          # The newest release on the line (ties: the larger tag name, as release_anchor);
          # one that is not on it is only allowed while another one is.
          export LC_ALL=C # tag names compare as bytes, like Python
          since="" best=-1 tag="" by="" off=""
          while IFS=$'\t' read -r name author; do
            [[ "$name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || continue
            [ "$name" != "$GITHUB_REF_NAME" ] || continue
            c=$(git rev-parse -q --verify "refs/tags/$name^{commit}") || {
              echo "releasen $name finns inte i klonen" >&2
              exit 1
            }
            rc=0
            git merge-base --is-ancestor "$c" "$GITHUB_SHA" || rc=$?
            [ "$rc" -le 1 ] || exit 1
            if [ "$rc" -eq 1 ] || [ "$c" = "$GITHUB_SHA" ]; then
              off="$off $name"
              continue
            fi
            n=$(git rev-list --count "$c")
            if [ "$n" -gt "$best" ] || { [ "$n" -eq "$best" ] && [[ "$name" > "$tag" ]]; }; then
              best=$n since=$c tag=$name by=$author
            fi
          done < "$gate/releases.txt"
          if [ -z "$since" ] && [ -n "$off" ]; then
            echo "ingen release på taggens linje, men andra finns:$off" >&2
            exit 1
          fi
          if [ -n "$since" ] && [ "$by" != "github-actions[bot]" ]; then
            echo "releasen $tag skapades av ${by:-?}, inte av release.yml" >&2
            exit 1
          fi
          rules="${since:-$GITHUB_SHA}"
          echo "Regler från $rules, kontroll efter ${since:-början av historiken}"
          scripts="check_merged_pr_gates.py workflow_rules.py check_owner_gate.py check_review_comments.py"
          for f in $scripts; do
            git show "$rules:tools/$f" > "$gate/$f"
          done
          # Out of the clone and isolated (-I): no repository file can stand in for a module.
          cd "$gate"
          /usr/bin/python3 -I -m venv venv
          printf '%s\n' 'pyyaml==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' \
            > requirements.txt
          venv/bin/python -I -m pip install -q --no-deps --only-binary :all: --require-hashes \
            -r requirements.txt
          if [ -n "$since" ]; then
            # An assignment fails the step when the command does (exit 2 on any error).
            anchor=$(venv/bin/python -E -s check_merged_pr_gates.py --root "$GITHUB_WORKSPACE" \
              --sha "$GITHUB_SHA" --anchor-for-tag "$GITHUB_REF_NAME")
            [ "$anchor" = "$since" ] || {
              echo "ankaret $since bekräftas inte av sina egna skript (${anchor:-inget})" >&2
              exit 1
            }
          fi
          venv/bin/python -E -s check_merged_pr_gates.py \
            --root "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA" ${since:+--since "$since"}

  build:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: The tag matches every version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/check_versions.py --expect "${TAG#v}"
      - name: Build
        run: just build
      - name: Release notes and assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/release
          uv run --no-sync python tools/release_prep.py "$TAG" --notes > dist/release/notes.md
          cp dist/*.whl dist/*.tar.gz dist/release/
          tar -C software/panel -czf "dist/release/searchdrone-panel-${TAG}.tar.gz" dist
          (cd dist/release && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
      - name: No orthophotos in the release
        run: python3 tools/check_no_orthophotos.py dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag must still name the commit the build job checked and built.
          tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "$TAG pekar nu på $tagged, inte $GITHUB_SHA som byggdes" >&2
            exit 1
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file release/notes.md ${prerelease[@]+"${prerelease[@]}"} \
            release/*.whl release/*.tar.gz release/SHA256SUMS
