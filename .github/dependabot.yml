# Weekly dependency updates. Minor and patch updates are grouped per ecosystem; new
# versions must be at least two weeks old (cooldown). Titles follow Conventional
# Commits so they pass gate/pr-title. Dependabot pull requests go through the same
# checks and reviews as every other pull request.
version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      uv:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /simulation/docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        update-types: [minor, patch]
